components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required: [error]
    Tour:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        destination: { type: string }
        country: { type: string }
        region: { type: ["string", "null"] }
        durationDays: { type: integer }
        category: { type: string }
        tourType: { type: string, enum: [private, group, flexible] }
        priceAmount: { type: ["number", "null"] }
        priceCurrency: { type: ["string", "null"] }
        availabilityStatus: { type: string, enum: [inquiry_only, scheduled, unavailable] }
        imageUrl: { type: string }
        summary: { type: string }
        description: { type: string }
        highlights:
          type: array
          items: { type: string }
        itinerary:
          type: array
          items:
            $ref: "#/components/schemas/ItineraryDay"
        included:
          type: array
          items: { type: string }
        notIncluded:
          type: array
          items: { type: string }
        isFeatured: { type: boolean }
        isDemo: { type: boolean }
        isPublished: { type: boolean }
      required:
        - id
        - slug
        - title
        - destination
        - country
        - region
        - durationDays
        - category
        - tourType
        - priceAmount
        - priceCurrency
        - availabilityStatus
        - imageUrl
        - summary
        - description
        - highlights
        - itinerary
        - included
        - notIncluded
        - isFeatured
        - isDemo
    TourCard:
      type: object
      properties:
        id: { type: integer }
        slug: { type: string }
        title: { type: string }
        destination: { type: string }
        country: { type: string }
        durationDays: { type: integer }
        category: { type: string }
        tourType: { type: string, enum: [private, group, flexible] }
        priceAmount: { type: ["number", "null"] }
        priceCurrency: { type: ["string", "null"] }
