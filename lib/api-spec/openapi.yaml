openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Public discovery, inquiry, content, booking, and administrator API for From Kano to the World.
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: discovery
    description: Public destinations, tours, and homepage content
  - name: content
    description: Public blog, gallery, and FAQ content
  - name: bookings
    description: Tour booking and confirmation
  - name: communication
    description: Contact inquiries and newsletter subscriptions
  - name: authentication
    description: Authenticated account profile and one-time administrator initialization
  - name: admin
    description: Administrative management operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /home:
    get:
      operationId: getHome
      tags: [discovery]
      summary: Get homepage content
      responses:
        "200":
          description: Homepage content
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeContent"
  /tours:
    get:
      operationId: getTours
      tags: [discovery]
      summary: Search published tours
      parameters:
        - name: q
          in: query
          schema: { type: string }
        - name: destination
          in: query
          schema: { type: string }
        - name: category
          in: query
          schema: { type: string }
        - name: tourType
          in: query
          schema: { type: string, enum: [private, group] }
        - name: minDuration
          in: query
          schema: { type: integer, minimum: 1 }
        - name: maxDuration
          in: query
          schema: { type: integer, minimum: 1 }
        - name: sort
          in: query
          schema: { type: string, enum: [recommended, newest, price_low, price_high] }
        - name: page
          in: query
          schema: { type: integer, minimum: 1, default: 1 }
        - name: pageSize
          in: query
          schema: { type: integer, minimum: 1, maximum: 24, default: 9 }
      responses:
        "200":
          description: Matching tours and pagination information
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TourList"
  /tours/{slug}:
    get:
      operationId: getTour
      tags: [discovery]
      summary: Get a published tour
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Tour detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tour"
        "404":
          description: Tour not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /destinations:
    get:
      operationId: getDestinations
      tags: [discovery]
      summary: List featured and published destinations
      responses:
        "200":
          description: Destinations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Destination"
  /destinations/{slug}:
    get:
      operationId: getDestination
      tags: [discovery]
      summary: Get a published destination
      parameters:
        - name: slug
          in: path
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Destination detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DestinationDetail"
        "404":
          description: Destination not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /blog:
    get:
      operationId: getBlogPosts
      tags: [content]
      summary: List published blog posts
      responses:
        "200":
          description: List of blog posts
          content:
            application/json:
              schema:
                type: array
                items:
