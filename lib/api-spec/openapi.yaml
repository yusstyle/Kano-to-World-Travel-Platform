  /auth/me:
    get:
      operationId: getAuthProfile
      tags: [authentication]
      summary: Get the signed-in user's local account profile
      responses:
        "200":
          description: Signed-in user's account profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProfile"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/initialize-admin:
    post:
      operationId: initializeAdmin
      tags: [authentication]
      summary: Claim the one-time administrator role for the configured verified email
      description: Requires a signed-in account whose verified primary email matches ADMIN_EMAIL. This succeeds only if no administrator exists.
      responses:
        "201":
          description: Administrator role initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProfile"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Signed-in account does not match the configured verified administrator email
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Administrator role has already been initialized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Administrator initialization is not configured or identity could not be verified
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
